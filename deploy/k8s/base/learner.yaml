# Consumes listening events. Replicas share the stream through a Redis consumer group, and a
# replica that dies leaves its pending events to be reclaimed by the others (XAUTOCLAIM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner
spec:
  replicas: 1
  selector:
    matchLabels: {app: learner}
  template:
    metadata:
      labels: {app: learner}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9100"}
    spec:
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: learner
          image: mci
          command: ["mci", "learner"]
          envFrom: [{configMapRef: {name: mci-model}}]
          ports: [{containerPort: 9100, name: metrics}]
          livenessProbe: {tcpSocket: {port: metrics}, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
